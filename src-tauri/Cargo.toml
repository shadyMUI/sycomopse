[package]
name = "peripheral-hub"
version = "0.1.0"
description = "Client Linux non ufficiale per periferiche Razer, Logitech e audio PipeWire"
authors = ["Peripheral Hub contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "peripheral_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "peripheral-hub"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "rt-multi-thread", "macros", "signal"] }
thiserror = "2"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
quick-xml = "0.38"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
