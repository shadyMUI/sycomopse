context.properties = {
  core.daemon = true
  core.name = peripheral-hub-worker-test
  support.dbus = false
  mem.warn-mlock = false
}
context.spa-libs = {
  support.* = support/libspa-support
  audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-access args = { access.allowed = [ "*" ] } }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-adapter }
]
context.objects = [
  { factory = adapter args = {
    factory.name = support.null-audio-sink
    node.name = "worker.\"\\selected';bad()--"
    media.class = Audio/Sink
    audio.channels = 2
    audio.position = [ FL FR ]
  } }
  { factory = adapter args = {
    factory.name = support.null-audio-sink
    node.name = worker.other
    media.class = Audio/Sink
    audio.channels = 2
    audio.position = [ FL FR ]
  } }
  { factory = metadata args = {
    metadata.name = default
    metadata.values = [
      { key = default.configured.audio.sink type = "Spa:String:JSON" value = { "name": "worker.baseline" } }
      { key = default.configured.audio.source type = "Spa:String:JSON" value = { "name": "source-kept" } }
    ]
  } }
]
context.exec = []
