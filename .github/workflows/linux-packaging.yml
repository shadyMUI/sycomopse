name: Linux Native Packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'src-tauri/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/linux-packaging.yml'

permissions:
  contents: read

jobs:
  installer-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python fixture and integrity tests (no installation)
        run: python -B -m unittest discover -s packaging/tests -v

  native-build:
    needs: installer-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch
          - cachyos
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
          - fedora-44
          - opensuse-leap-16.0
          - opensuse-tumbleweed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Installer fixtures
        run: python3 -B -m unittest discover -s packaging/tests -v
      - name: Shell syntax
        run: |
          bash -n packaging/install.sh
          bash -n packaging/ci/bootstrap.sh
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/peripheral-hub.install
          for file in packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm; do bash -n "$file" || exit 1; done
      - name: Locked software gates, ELF/import audit and rootless systemd native smoke
        run: python3 -B packaging/ci/matrix.py --engine podman --target '${{ matrix.target }}' --output packaging/out/quarantine
      - name: Upload native-smoke-gated packages and evidence (no hardware certification)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peripheral-hub-0.1.0-${{ matrix.target }}-x86_64
          path: packaging/out/quarantine/peripheral-hub-0.1.0-${{ matrix.target }}-x86_64/
          if-no-files-found: error
          retention-days: 14
