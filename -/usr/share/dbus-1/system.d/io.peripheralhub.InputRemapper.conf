<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.peripheralhub.InputRemapper"/>
    <deny send_destination="io.peripheralhub.InputRemapper"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="io.peripheralhub.InputRemapper1" send_member="GetVersion"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="io.peripheralhub.InputRemapper1" send_member="Inventory"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="io.peripheralhub.InputRemapper1" send_member="State"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="io.peripheralhub.InputRemapper1" send_member="Apply"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="io.peripheralhub.InputRemapper1" send_member="Stop"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="io.peripheralhub.InputRemapper" send_path="/io/peripheralhub/InputRemapper" send_interface="org.freedesktop.DBus.Peer" send_member="GetMachineId"/>
  </policy>
  <policy user="root">
    <allow own="io.peripheralhub.InputRemapper"/>
  </policy>
</busconfig>
